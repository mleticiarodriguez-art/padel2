<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Marcador de Pádel - Modo Corrección</title>
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a472a">
    
    <style>
        /* Estilos base (mismos que antes, compactados) */
        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(145deg, #1a472a 0%, #0e2a1a 100%);
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            padding: 16px;
        }

        .container {
            max-width: 950px;
            margin: 0 auto;
        }

        .scoreboard {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            border-radius: 60px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,215,0,0.3);
        }

        .screen-wake {
            background: #2a4a3a;
            border-radius: 30px;
            padding: 6px 12px;
            font-size: 0.7rem;
            margin-bottom: 15px;
            color: #FFD966;
            display: inline-block;
        }

        .names-section {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 20px;
        }

        .name-card {
            flex: 1;
            text-align: center;
            background: #0f2120;
            border-radius: 48px;
            padding: 12px;
        }

        .name-card label {
            display: block;
            font-size: 0.8rem;
            color: #b8d9b0;
            margin-bottom: 6px;
        }

        .name-card input {
            width: 90%;
            padding: 10px;
            font-size: 1.2rem;
            text-align: center;
            border: none;
            border-radius: 40px;
            background: #f9f2da;
            font-weight: bold;
            color: #1e3a2a;
        }

        .current-game {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 20px;
        }

        .team {
            flex: 1;
            text-align: center;
            background: #0f2120;
            border-radius: 48px;
            padding: 15px;
        }

        .team-points {
            font-size: 4.5rem;
            font-weight: 800;
            background: #000000aa;
            display: inline-block;
            min-width: 140px;
            padding: 10px 25px;
            border-radius: 64px;
            color: #f9f3d9;
            margin: 8px 0;
            font-family: monospace;
        }

        .buttons {
            display: flex;
            justify-content: center;
            gap: 18px;
            margin-top: 12px;
        }

        button {
            font-size: 2rem;
            font-weight: bold;
            border: none;
            width: 70px;
            padding: 12px 0;
            border-radius: 60px;
            cursor: pointer;
            box-shadow: 0 5px 0 rgba(0,0,0,0.3);
            transition: transform 0.05s;
        }

        button:active {
            transform: translateY(3px);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-add { background: #2b7a3e; color: white; }
        .btn-sub { background: #9e3c2c; color: white; }

        .voice-control {
            background: linear-gradient(135deg, #2c3e4e, #1a2a3a);
            border-radius: 50px;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
            border: 1px solid #FFD96655;
        }

        .voice-status {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .mic-button {
            background: #d49b3a;
            color: #1e3a2a;
            border: none;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            font-size: 2rem;
            cursor: pointer;
            box-shadow: 0 5px 0 #8b5e2a;
        }

        .mic-button.listening {
            background: #ff4444;
            color: white;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .voice-feedback {
            background: #000000aa;
            border-radius: 30px;
            padding: 10px;
            margin-top: 10px;
            font-size: 0.9rem;
            color: #FFE6B0;
        }

        .debug-log {
            background: #0a1a15aa;
            border-radius: 20px;
            padding: 8px;
            margin-top: 8px;
            font-size: 0.7rem;
            color: #88aa88;
            font-family: monospace;
            text-align: left;
            max-height: 100px;
            overflow-y: auto;
        }

        .test-mode {
            background: #d49b3a;
            color: #1e3a2a;
            border-radius: 20px;
            padding: 5px 10px;
            font-size: 0.7rem;
            margin-top: 8px;
            cursor: pointer;
            display: inline-block;
        }

        .games-container {
            background: #1e2a25c9;
            border-radius: 40px;
            padding: 12px;
            margin-bottom: 16px;
        }

        .current-set-games {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            font-size: 2.5rem;
            background: #00000066;
            border-radius: 50px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .current-set-games span:first-child,
        .current-set-games span:last-child {
            background: #2a4a3a;
            padding: 8px 30px;
            border-radius: 40px;
            color: #FFE6B0;
            min-width: 90px;
            text-align: center;
        }

        .current-set-games span:nth-child(2) {
            color: #FFD966;
            font-size: 2.8rem;
        }

        .sets-won-section {
            background: #00000055;
            border-radius: 40px;
            padding: 12px;
            margin-top: 10px;
        }

        .sets-won {
            display: flex;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;
        }

        .set-card {
            background: #0f2120;
            border-radius: 30px;
            padding: 10px 20px;
            text-align: center;
            border: 1px solid #FFD96655;
        }

        .set-result {
            font-size: 1.6rem;
            font-weight: bold;
            color: #FFE6B0;
        }

        .global-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .action-btn {
            font-size: 1rem;
            width: auto;
            padding: 10px 20px;
            background: #2c3e4e;
            color: white;
        }

        .history-section {
            background: rgba(0, 0, 0, 0.7);
            border-radius: 40px;
            padding: 16px;
            margin-top: 20px;
        }

        .history-title {
            font-size: 1.4rem;
            color: #FFE6B0;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
        }

        .history-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .history-item {
            background: #1e3a2aaa;
            border-radius: 30px;
            padding: 10px;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: #e9f5db;
        }

        .clear-history {
            background: #7a2c1f;
            font-size: 0.8rem;
            padding: 6px 14px;
        }

        .winner-msg {
            text-align: center;
            background: gold;
            border-radius: 40px;
            padding: 8px;
            margin-top: 12px;
            font-weight: bold;
            color: #1e3a2a;
        }

        .gold-rule {
            text-align: center;
            font-size: 0.85rem;
            color: #FFD966;
            margin-top: 8px;
            background: #00000077;
            padding: 6px;
            border-radius: 30px;
        }

        @media (max-width: 550px) {
            .team-points { font-size: 2.5rem; min-width: 100px; padding: 5px 15px; }
            button { width: 55px; font-size: 1.5rem; }
            .current-set-games span:first-child,
            .current-set-games span:last-child { padding: 5px 15px; min-width: 60px; font-size: 1.5rem; }
            .mic-button { width: 55px; height: 55px; font-size: 1.5rem; }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="scoreboard">
        <div class="screen-wake" id="wakeLockStatus">🔋 Pantalla activa: ACTIVADA</div>

        <div class="names-section">
            <div class="name-card">
                <label>🏸 PAREJA A (Comandos: "A", "Uno", "Juan")</label>
                <input type="text" id="nameA" placeholder="Ej: Juan" value="Juan">
            </div>
            <div class="name-card">
                <label>🏸 PAREJA B (Comandos: "B", "Dos", "Pedro")</label>
                <input type="text" id="nameB" placeholder="Ej: Pedro" value="Pedro">
            </div>
        </div>

        <div class="voice-control">
            <div class="voice-status">
                <button class="mic-button" id="micBtn">🎤</button>
                <div class="voice-feedback" id="voiceFeedback">
                    ⚪ Pulsá el micrófono para activar
                </div>
            </div>
            <div style="display: flex; justify-content: center; gap: 10px; margin-top: 8px;">
                <span class="test-mode" id="testModeBtn">🔧 Modo Prueba (activar)</span>
            </div>
            <div class="debug-log" id="debugLog">
                📝 Log de comandos aparecerá aquí...
            </div>
        </div>

        <div class="current-game">
            <div class="team">
                <div class="team-points" id="pointsA">0</div>
                <div class="buttons">
                    <button class="btn-sub" id="subA">-1</button>
                    <button class="btn-add" id="addA">+1</button>
                </div>
            </div>
            <div class="team">
                <div class="team-points" id="pointsB">0</div>
                <div class="buttons">
                    <button class="btn-sub" id="subB">-1</button>
                    <button class="btn-add" id="addB">+1</button>
                </div>
            </div>
        </div>

        <div class="gold-rule">⚜️ PUNTO DE ORO: En 40-40 el siguiente punto GANA el juego ⚜️</div>

        <div class="games-container">
            <div class="games-title" id="setStatusTitle">🎾 JUEGOS EN ESTE SET</div>
            <div class="current-set-games">
                <span id="gamesA">0</span>
                <span>-</span>
                <span id="gamesB">0</span>
            </div>
            <div id="tiebreakIndicator" style="text-align: center;"></div>
        </div>

        <div class="sets-won-section">
            <div class="sets-title">🏆 SETS GANADOS</div>
            <div class="sets-won" id="setsHistory">
                <div class="set-card">SET 1: <span id="set1">-</span></div>
                <div class="set-card">SET 2: <span id="set2">-</span></div>
                <div class="set-card">SET 3: <span id="set3">-</span></div>
            </div>
        </div>

        <div class="global-buttons">
            <button class="action-btn" id="resetMatchBtn">🔄 REINICIAR</button>
            <button class="action-btn" id="finishMatchBtn">🎯 FINALIZAR</button>
        </div>
        <div id="winnerMsg" class="winner-msg" style="display: none;"></div>
    </div>

    <div class="history-section">
        <div class="history-title">
            📋 HISTORIAL
            <button class="clear-history" id="clearHistoryBtn">🗑️ BORRAR</button>
        </div>
        <div id="historyList" class="history-list">
            <div style="text-align:center; color:#aaa;">📭 Sin partidos jugados aún</div>
        </div>
    </div>
</div>

<script>
    // ==================== MODO PRUEBA ====================
    let testMode = false;
    const testModeBtn = document.getElementById('testModeBtn');
    const debugLog = document.getElementById('debugLog');
    
    function agregarLog(mensaje, tipo = 'info') {
        const logEntry = document.createElement('div');
        const hora = new Date().toLocaleTimeString();
        logEntry.innerHTML = `[${hora}] ${mensaje}`;
        logEntry.style.color = tipo === 'error' ? '#ff8888' : (tipo === 'success' ? '#88ff88' : '#aaffaa');
        logEntry.style.borderBottom = '1px solid #2a4a3a';
        logEntry.style.padding = '2px 0';
        debugLog.prepend(logEntry);
        
        // Mantener solo últimos 20 logs
        while (debugLog.children.length > 20) {
            debugLog.removeChild(debugLog.lastChild);
        }
        
        // También en consola para debug
        console.log(mensaje);
    }
    
    testModeBtn.addEventListener('click', () => {
        testMode = !testMode;
        if (testMode) {
            testModeBtn.innerHTML = '🔧 Modo Prueba (activado)';
            testModeBtn.style.background = '#ff4444';
            testModeBtn.style.color = 'white';
            agregarLog('🔧 MODO PRUEBA ACTIVADO - Se mostrará lo que escucha el micrófono');
        } else {
            testModeBtn.innerHTML = '🔧 Modo Prueba (activar)';
            testModeBtn.style.background = '#d49b3a';
            testModeBtn.style.color = '#1e3a2a';
            agregarLog('🔧 Modo prueba desactivado');
        }
    });
    
    // ==================== WAKE LOCK ====================
    let wakeLock = null;
    async function activarWakeLock() {
        if ('wakeLock' in navigator) {
            try {
                wakeLock = await navigator.wakeLock.request('screen');
                document.getElementById('wakeLockStatus').innerHTML = '🔋 Pantalla activa: ACTIVADA ✅';
            } catch(err) {}
        }
    }
    activarWakeLock();
    
    // ==================== VOZ MEJORADA ====================
    let recognition = null;
    let listening = false;
    let shouldRestart = true;
    let lastCommandTime = 0;
    const COMMAND_COOLDOWN = 800;
    
    const micBtn = document.getElementById('micBtn');
    const voiceFeedback = document.getElementById('voiceFeedback');
    const nameAInput = document.getElementById('nameA');
    const nameBInput = document.getElementById('nameB');
    
    // Lista de comandos explícitos por equipo
    function detectarComandoClaro(transcript, nombres) {
        const texto = transcript.toLowerCase()
            .replace(/á/g, 'a').replace(/é/g, 'e').replace(/í/g, 'i')
            .replace(/ó/g, 'o').replace(/ú/g, 'u');
        
        const nombreA = nombres.a.toLowerCase();
        const nombreB = nombres.b.toLowerCase();
        
        // Palabras clave para cada equipo (MUY CLARAS)
        const comandosA = [
            'punto a', 'puntoa', 'a punto', 'gana a', 'suma a', 'anota a',
            'punto ' + nombreA, nombreA + ' punto', 'gana ' + nombreA, nombreA + ' gana',
            'a', 'uno', 'equipo a'
        ];
        
        const comandosB = [
            'punto b', 'puntob', 'b punto', 'gana b', 'suma b', 'anota b',
            'punto ' + nombreB, nombreB + ' punto', 'gana ' + nombreB, nombreB + ' gana',
            'b', 'dos', 'equipo b'
        ];
        
        // Verificar comandos exactos primero
        for (let cmd of comandosA) {
            if (texto.includes(cmd)) {
                agregarLog(`🎯 Detectado: "${cmd}" → Equipo A`, 'success');
                return 'A';
            }
        }
        
        for (let cmd of comandosB) {
            if (texto.includes(cmd)) {
                agregarLog(`🎯 Detectado: "${cmd}" → Equipo B`, 'success');
                return 'B';
            }
        }
        
        // Si no, intentar con los nombres solos (pero requiriendo palabra clave)
        const tieneAccion = texto.includes('punto') || texto.includes('gana') || 
                           texto.includes('suma') || texto.includes('anota') || 
                           texto.includes('marca');
        
        if (tieneAccion) {
            if (texto.includes(nombreA) && !texto.includes(nombreB)) {
                agregarLog(`🎯 Detectado: "${nombreA}" + acción → Equipo A`, 'success');
                return 'A';
            }
            if (texto.includes(nombreB) && !texto.includes(nombreA)) {
                agregarLog(`🎯 Detectado: "${nombreB}" + acción → Equipo B`, 'success');
                return 'B';
            }
        }
        
        return null;
    }
    
    function iniciarReconocimiento() {
        if (!('webkitSpeechRecognition' in window)) {
            voiceFeedback.innerHTML = '❌ Navegador no compatible';
            return false;
        }
        
        const SpeechRecognition = window.webkitSpeechRecognition;
        const newRecognition = new SpeechRecognition();
        newRecognition.continuous = true;
        newRecognition.interimResults = true;
        newRecognition.lang = 'es-ES';
        
        newRecognition.onstart = () => {
            listening = true;
            micBtn.classList.add('listening');
            voiceFeedback.innerHTML = '🎤 Escuchando... Decí: "Punto A" o "Punto B"';
            voiceFeedback.style.background = '#d49b3aaa';
            agregarLog('🎤 Micrófono activado - Modo escucha continua');
        };
        
        newRecognition.onend = () => {
            if (shouldRestart && !ganadorPartido) {
                setTimeout(() => {
                    if (shouldRestart && !ganadorPartido && recognition) {
                        try { recognition.start(); } catch(e) {}
                    }
                }, 200);
            } else {
                listening = false;
                micBtn.classList.remove('listening');
                if (!ganadorPartido) {
                    voiceFeedback.innerHTML = '⚡ Voz desactivada';
                    voiceFeedback.style.background = '#000000aa';
                }
            }
        };
        
        newRecognition.onresult = (event) => {
            const nombres = obtenerNombres();
            
            for (let i = event.resultIndex; i < event.results.length; i++) {
                const result = event.results[i];
                const transcript = result[0].transcript;
                const isFinal = result.isFinal;
                
                if (testMode) {
                    agregarLog(`🎤 Escuchado: "${transcript}" ${isFinal ? '(final)' : '(provisional)'}`);
                }
                
                if (isFinal) {
                    const equipo = detectarComandoClaro(transcript, nombres);
                    
                    if (equipo) {
                        const ahora = Date.now();
                        if (ahora - lastCommandTime > COMMAND_COOLDOWN) {
                            lastCommandTime = ahora;
                            const nombreEquipo = equipo === 'A' ? nameAInput.value : nameBInput.value;
                            voiceFeedback.innerHTML = `✅ ¡Punto para ${nombreEquipo}! (${transcript.substring(0, 30)})`;
                            voiceFeedback.style.background = '#2b7a3eaa';
                            agregarLog(`✅ EJECUTANDO: Punto para Equipo ${equipo} - "${transcript}"`, 'success');
                            setTimeout(() => {
                                if (listening) voiceFeedback.style.background = '#d49b3aaa';
                            }, 1000);
                            sumarPunto(equipo);
                        } else {
                            agregarLog(`⏱️ Ignorado (cooldown): ${transcript}`);
                        }
                    } else if (testMode && transcript.length > 0) {
                        agregarLog(`❓ No reconocido: "${transcript}" - Decí "Punto A" o "Punto B"`);
                    }
                }
            }
        };
        
        newRecognition.onerror = (event) => {
            agregarLog(`❌ Error: ${event.error}`, 'error');
            if (event.error === 'not-allowed') {
                voiceFeedback.innerHTML = '🔴 Permiso denegado. Activá el micrófono en Configuración';
                shouldRestart = false;
                listening = false;
                micBtn.classList.remove('listening');
            }
        };
        
        recognition = newRecognition;
        return true;
    }
    
    function obtenerNombres() {
        return {
            a: nameAInput.value.trim() || "Juan",
            b: nameBInput.value.trim() || "Pedro"
        };
    }
    
    async function pedirPermisoYActivar() {
        if (ganadorPartido) {
            voiceFeedback.innerHTML = '⚠️ Partido terminado. Reiniciá para seguir.';
            return;
        }
        
        if (listening) {
            shouldRestart = false;
            if (recognition) recognition.stop();
            listening = false;
            micBtn.classList.remove('listening');
            voiceFeedback.innerHTML = '⚡ Voz desactivada';
            agregarLog('🔇 Voz desactivada manualmente');
            return;
        }
        
        voiceFeedback.innerHTML = '🎤 Solicitando permiso...';
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            stream.getTracks().forEach(track => track.stop());
            if (!recognition) iniciarReconocimiento();
            shouldRestart = true;
            recognition.start();
            agregarLog('🎤 Voz activada - Escuchando comandos');
        } catch (err) {
            voiceFeedback.innerHTML = '🔴 Permiso denegado';
            agregarLog('🔴 ERROR: No se pudo acceder al micrófono', 'error');
        }
    }
    
    micBtn.addEventListener('click', pedirPermisoYActivar);
    
    if (!('webkitSpeechRecognition' in window)) {
        voiceFeedback.innerHTML = '❌ Chrome no soporta voz. Usá los botones.';
        micBtn.disabled = true;
    }
    
    // ==================== LÓGICA DEL MARCADOR ====================
    let modoTiebreak = false;
    let puntosTiebreakA = 0, puntosTiebreakB = 0;
    
    function puntosATexto(puntos) {
        if (modoTiebreak) return puntos.toString();
        if (puntos === 0) return "0";
        if (puntos === 1) return "15";
        if (puntos === 2) return "30";
        return "40";
    }
    
    let puntosA = 0, puntosB = 0, juegosA = 0, juegosB = 0, setsCompletados = [], ganadorPartido = null;
    
    const pointsASpan = document.getElementById('pointsA');
    const pointsBSpan = document.getElementById('pointsB');
    const gamesASpan = document.getElementById('gamesA');
    const gamesBSpan = document.getElementById('gamesB');
    const set1Span = document.getElementById('set1');
    const set2Span = document.getElementById('set2');
    const set3Span = document.getElementById('set3');
    const winnerMsgDiv = document.getElementById('winnerMsg');
    const setStatusTitle = document.getElementById('setStatusTitle');
    const tiebreakIndicator = document.getElementById('tiebreakIndicator');
    
    let historialPartidos = [];
    
    function actualizarUI() {
        if (modoTiebreak) {
            setStatusTitle.innerHTML = "🎾 TIE-BREAK";
            tiebreakIndicator.innerHTML = '⚡ MODO TIE-BREAK ⚡';
            pointsASpan.innerText = puntosTiebreakA;
            pointsBSpan.innerText = puntosTiebreakB;
        } else {
            setStatusTitle.innerHTML = "🎾 JUEGOS EN ESTE SET";
            tiebreakIndicator.innerHTML = '';
            pointsASpan.innerText = puntosATexto(puntosA);
            pointsBSpan.innerText = puntosATexto(puntosB);
        }
        gamesASpan.innerText = juegosA;
        gamesBSpan.innerText = juegosB;
        set1Span.innerText = setsCompletados[0] || "-";
        set2Span.innerText = setsCompletados[1] || "-";
        set3Span.innerText = setsCompletados[2] || "-";
    }
    
    function ganarJuego(equipo) {
        if (ganadorPartido) return;
        if (equipo === 'A') juegosA++;
        else juegosB++;
        puntosA = 0; puntosB = 0;
        actualizarUI();
        
        // Verificar set
        if (!modoTiebreak) {
            if (juegosA >= 6 && (juegosA - juegosB) >= 2) {
                setsCompletados.push(`${juegosA}-${juegosB}`);
                juegosA = 0; juegosB = 0;
                actualizarUI();
                const setsA = setsCompletados.filter(s => parseInt(s.split('-')[0]) > parseInt(s.split('-')[1])).length;
                const setsB = setsCompletados.filter(s => parseInt(s.split('-')[1]) > parseInt(s.split('-')[0])).length;
                if (setsA >= 2) finalizarPartido('A');
                else if (setsB >= 2) finalizarPartido('B');
            }
            else if (juegosA === 6 && juegosB === 6) {
                modoTiebreak = true;
                puntosTiebreakA = 0;
                puntosTiebreakB = 0;
                actualizarUI();
            }
        }
    }
    
    function ganarTiebreak(equipo) {
        if (ganadorPartido) return;
        if (equipo === 'A') juegosA++;
        else juegosB++;
        setsCompletados.push(`${juegosA}-${juegosB}`);
        juegosA = 0; juegosB = 0;
        modoTiebreak = false;
        puntosA = 0; puntosB = 0;
        actualizarUI();
        const setsA = setsCompletados.filter(s => parseInt(s.split('-')[0]) > parseInt(s.split('-')[1])).length;
        const setsB = setsCompletados.filter(s => parseInt(s.split('-')[1]) > parseInt(s.split('-')[0])).length;
        if (setsA >= 2) finalizarPartido('A');
        else if (setsB >= 2) finalizarPartido('B');
    }
    
    function sumarPunto(equipo) {
        if (ganadorPartido) return;
        
        if (modoTiebreak) {
            if (equipo === 'A') puntosTiebreakA++;
            else puntosTiebreakB++;
            actualizarUI();
            if (puntosTiebreakA >= 7 && (puntosTiebreakA - puntosTiebreakB) >= 2) ganarTiebreak('A');
            else if (puntosTiebreakB >= 7 && (puntosTiebreakB - puntosTiebreakA) >= 2) ganarTiebreak('B');
            return;
        }
        
        // Punto de oro
        if (puntosA === 3 && puntosB === 3) {
            ganarJuego(equipo);
            return;
        }
        
        if (equipo === 'A' && puntosA === 3 && puntosB < 3) {
            ganarJuego('A');
            return;
        }
        if (equipo === 'B' && puntosB === 3 && puntosA < 3) {
            ganarJuego('B');
            return;
        }
        
        if (equipo === 'A') { if (puntosA < 3) puntosA++; }
        else { if (puntosB < 3) puntosB++; }
        actualizarUI();
    }
    
    function restarPunto(equipo) {
        if (ganadorPartido) return;
        if (modoTiebreak) {
            if (equipo === 'A' && puntosTiebreakA > 0) puntosTiebreakA--;
            else if (equipo === 'B' && puntosTiebreakB > 0) puntosTiebreakB--;
            actualizarUI();
            return;
        }
        if (puntosA === 3 && puntosB === 3) return;
        if (equipo === 'A' && puntosA > 0) puntosA--;
        else if (equipo === 'B' && puntosB > 0) puntosB--;
        actualizarUI();
    }
    
    function finalizarPartido(ganadorCod) {
        if (ganadorPartido) return;
        ganadorPartido = ganadorCod;
        shouldRestart = false;
        if (recognition) recognition.stop();
        
        const nombreA = nameAInput.value.trim() || "Pareja A";
        const nombreB = nameBInput.value.trim() || "Pareja B";
        const ganadorNombre = ganadorCod === 'A' ? nombreA : nombreB;
        const setsA = setsCompletados.filter(s => parseInt(s.split('-')[0]) > parseInt(s.split('-')[1])).length;
        const setsB = setsCompletados.filter(s => parseInt(s.split('-')[1]) > parseInt(s.split('-')[0])).length;
        
        historialPartidos.unshift({
            fecha: new Date().toLocaleString(),
            equipoA: nombreA,
            equipoB: nombreB,
            setsAGanados: setsA,
            setsBGanados: setsB,
            setsDetalle: [...setsCompletados],
            ganador: ganadorNombre
        });
        guardarHistorial();
        
        winnerMsgDiv.style.display = "block";
        winnerMsgDiv.innerText = `🏆 ¡${ganadorNombre} GANA! (${setsA}-${setsB}) 🏆`;
        
        document.getElementById('addA').disabled = true;
        document.getElementById('addB').disabled = true;
        document.getElementById('subA').disabled = true;
        document.getElementById('subB').disabled = true;
        agregarLog(`🏆 Partido finalizado. Ganador: ${ganadorNombre}`);
    }
    
    function reiniciarPartido() {
        puntosA = 0; puntosB = 0; juegosA = 0; juegosB = 0;
        setsCompletados = []; ganadorPartido = null;
        modoTiebreak = false;
        puntosTiebreakA = 0; puntosTiebreakB = 0;
        actualizarUI();
        winnerMsgDiv.style.display = "none";
        document.getElementById('addA').disabled = false;
        document.getElementById('addB').disabled = false;
        document.getElementById('subA').disabled = false;
        document.getElementById('subB').disabled = false;
        agregarLog('🔄 Partido reiniciado');
        
        if (listening) {
            shouldRestart = false;
            if (recognition) recognition.stop();
            setTimeout(() => {
                if (!ganadorPartido) { shouldRestart = true; recognition.start(); }
            }, 300);
        }
    }
    
    function guardarHistorial() {
        localStorage.setItem('padel_historial_corregido', JSON.stringify(historialPartidos));
        renderizarHistorial();
    }
    
    function cargarHistorial() {
        const guardado = localStorage.getItem('padel_historial_corregido');
        historialPartidos = guardado ? JSON.parse(guardado) : [];
        renderizarHistorial();
    }
    
    function renderizarHistorial() {
        const historyDiv = document.getElementById('historyList');
        if (!historialPartidos.length) {
            historyDiv.innerHTML = '<div style="text-align:center; color:#aaa;">📭 Sin partidos</div>';
            return;
        }
        let html = '';
        for (let p of historialPartidos) {
            html += `<div class="history-item"><strong>${p.fecha}</strong><br>🎾 ${p.equipoA} vs ${p.equipoB}<br>📊 Sets: ${p.setsAGanados}-${p.setsBGanados} (${p.setsDetalle.join(', ')})<br>🏆 Ganador: ${p.ganador}</div>`;
        }
        historyDiv.innerHTML = html;
    }
    
    document.getElementById('addA').addEventListener('click', () => sumarPunto('A'));
    document.getElementById('addB').addEventListener('click', () => sumarPunto('B'));
    document.getElementById('subA').addEventListener('click', () => restarPunto('A'));
    document.getElementById('subB').addEventListener('click', () => restarPunto('B'));
    document.getElementById('resetMatchBtn').addEventListener('click', reiniciarPartido);
    document.getElementById('finishMatchBtn').addEventListener('click', () => {
        if (!ganadorPartido) alert("El partido aún no terminó");
    });
    document.getElementById('clearHistoryBtn').addEventListener('click', () => {
        if (confirm("¿Borrar historial?")) { historialPartidos = []; guardarHistorial(); }
    });
    
    cargarHistorial();
    reiniciarPartido();
</script>
</body>
</html>
